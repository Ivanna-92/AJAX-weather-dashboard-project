<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AirCare Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            AIRCARE
        </div>

        <nav>
            <a href="#dashboard">Dashboard</a>
            <a href="#locations">Locations</a>
        </nav>
        
    </header>

    <main class="main-content" id="dashboard">

        <section class="welcome-section">

            <h1> Weather & Climate Dashboard</h1>
            <p> Search for a location to see current weather conditions.</p>

        </section>

        <section class="search-section" id="locations">

            <h2>Search Location</h2>

            <form id="search-form">

                <input type="text" id="location-input" placeholder="Enter a town or postcode">
                <button type="submit">Search</button>

            </form>

        </section>

        <section class="result-section" id="results">

            <h2>Weather Information</h2>
            <p>Search for a location above to see weather information.</p>

        </section>

    </main>
    <script src="script.js"></script>
</body>

</html>
